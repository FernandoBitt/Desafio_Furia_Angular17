<div class="chat-container">
  <div class="messages-wrapper">
    @for (msg of chatInput; track $index) {
      <div [class.user-message]="msg.isUser" [class.bot-message]="!msg.isUser">
        {{ msg.text }}
      </div>
    }
  </div>

  <div class="input-wrapper">
    <input [(ngModel)]="sessionId" placeholder="Digite sua mensagem..." (keyup.enter)="sendMessage()">
    <button (click)="sendMessage()">Enviar</button>
  </div>
</div>
